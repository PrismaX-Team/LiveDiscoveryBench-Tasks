name: Validate task package structure

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Read-only structure check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute base-branch policy, never a checker supplied by the PR.
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: policy
          persist-credentials: false
      - name: Check out candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Test trusted checker
        run: python3 -I policy/.github/scripts/test_task_structure.py
      - name: Validate candidate without running task code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I policy/.github/scripts/task_structure.py candidate
